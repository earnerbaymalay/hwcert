[package]
name = "llm-bench"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
publish = { workspace = true }
description = "LLM inference benchmarking with llama.cpp, candle, and ONNX Runtime"

[dependencies]
# Optional: llama.cpp (requires cmake + Visual Studio build tools)
llama-cpp-2 = { workspace = true, optional = true }
tokenizers = { workspace = true }
candle-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
rand = { workspace = true }

# Optional: ONNX Runtime (requires valid download URL for onnxruntime-sys)
onnxruntime = { version = "0.0.14", optional = true }

[features]
default = []
llama = ["llama-cpp-2"]
onnx = ["onnxruntime"]