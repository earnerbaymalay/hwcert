[package]
name = "hw-inventory"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
publish = { workspace = true }
description = "Hardware inventory: CPU, GPU, memory, storage, battery, USB, PCI"

[dependencies]
sysinfo = { workspace = true }
nvml-wrapper = { workspace = true, optional = true }
# smartctl = { workspace = true }  # Removed - not available on crates.io
usb-ids = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }

[features]
default = []
# NVIDIA GPU details via NVML (needs the NVIDIA driver at runtime)
nvml = ["dep:nvml-wrapper"]

[dev-dependencies]
tokio = { workspace = true }
